<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buongiorni settembre</title>
    <!-- Typography raffinata -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Icone FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-color: #F8FAFC;
            --surface-color: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --text-light: #94A3B8;
            
            --sales-navy: #1E3A8A;
            --sales-gold: #D97706;
            --sales-gold-light: #FEF3C7;
            
            --border-subtle: #E2E8F0;
            --border-hover: #CBD5E1;
            
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.06), 0 2px 4px -2px rgb(0 0 0 / 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 48px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 780px;
            width: 100%;
        }

        /* HEADER */
        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .motto-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--surface-color);
            color: var(--sales-navy);
            border: 1px solid var(--border-subtle);
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 16px;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.3rem;
            font-weight: 700;
            color: var(--sales-navy);
            letter-spacing: -0.03em;
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 0.98rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* INTESTAZIONE GIORNI (LUN - VEN) */
        .week-header {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            margin-bottom: 12px;
            text-align: center;
        }

        .week-day-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* GRIGLIA ESATTA DA 5 COLONNE */
        .grid-quadrati {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
        }

        /* Responsive per smartphone piccoli */
        @media (max-width: 550px) {
            .week-header {
                display: none;
            }
            .grid-quadrati {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
        }

        .item-square {
            aspect-ratio: 1 / 1;
            background-color: var(--surface-color);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            text-decoration: none;
            color: var(--text-main);
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
            position: relative;
        }

        .item-square:not(.disabled):hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            border-color: var(--border-hover);
            background-color: #FAFAFA;
        }

        /* STILE QUADRATO DISABILITATO */
        .item-square.disabled {
            opacity: 0.45;
            cursor: not-allowed;
            background-color: #F1F5F9;
        }

        .item-square.disabled .square-icon {
            visibility: hidden;
        }

        /* STILE EVIDENZIATO PER IL GIORNO CORRENTE */
        .item-square.today {
            border: 2px solid var(--sales-gold);
            background-color: var(--sales-gold-light);
            box-shadow: var(--shadow-md);
            opacity: 1;
        }

        .item-square.today .square-day {
            color: var(--sales-gold);
        }

        .today-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 0.55rem;
            font-weight: 700;
            background-color: var(--sales-gold);
            color: white;
            padding: 2px 5px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .square-month {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-light);
        }

        .square-day {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            font-weight: 600;
            line-height: 1;
            color: var(--sales-navy);
        }

        .square-icon {
            color: var(--text-light);
            font-size: 0.8rem;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .item-square:not(.disabled):hover .square-icon {
            color: var(--sales-navy);
            transform: translate(2px, -2px);
        }

        .item-square.today .square-icon {
            color: var(--sales-gold);
        }

        /* FOOTER */
        footer {
            text-align: center;
            margin-top: 50px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-light);
        }

        footer strong {
            color: var(--text-muted);
            font-weight: 600;
        }
    </style>
</head>
<body>

<script>
    // EVIDENZIA AUTOMATICAMENTE IL GIORNO CORRENTE
    window.addEventListener('DOMContentLoaded', () => {
        const now = new Date();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        
        const todayKey = `${month}-${day}`;

        const todaySquare = document.querySelector(`.item-square[data-date="${todayKey}"]`);

        if (todaySquare) {
            todaySquare.classList.add('today');
            
            const badge = document.createElement('span');
            badge.className = 'today-badge';
            badge.innerText = 'Oggi';
            todaySquare.appendChild(badge);
        }
    });
</script>
